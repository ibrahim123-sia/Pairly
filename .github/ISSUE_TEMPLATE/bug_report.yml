name: Bug report
description: Something in Pairly does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as the demo manager
        2. Open Product Bundles
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or API endpoint, browser and OS
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or customer data first.
