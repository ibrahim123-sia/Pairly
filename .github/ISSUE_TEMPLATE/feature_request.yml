name: Feature request
description: Suggest an improvement to Pairly
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is it for (store manager, super admin) and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead?
