name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (SQLite, mock LLM)
        run: pytest

  postgres:
    name: PostgreSQL (migrations, seed, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pairly
          POSTGRES_PASSWORD: pairly
          POSTGRES_DB: pairly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pairly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pairly:pairly@localhost:5432/pairly
      MAIL_SUPPRESS_SEND: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Seed the demo store (twice, must be repeatable)
        run: |
          python scripts/seed_demo.py
          python scripts/seed_demo.py
      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Full test suite on PostgreSQL
        env:
          PGPASSWORD: pairly
          PAIRLY_TEST_DATABASE_URL: postgresql://pairly:pairly@localhost:5432/pairly_test
        run: |
          createdb -h localhost -U pairly pairly_test
          pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker compose (end to end)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Check the web app and API through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>Pairly</title>"
          curl -fsS http://localhost:8080/api/health | grep -q healthy
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"Demo@12345"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/analytics/summary | grep -q total_revenue
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/ai/insights | grep -q insights
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
