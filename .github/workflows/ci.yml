name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (SQLite, mock LLM)
        run: pytest

  postgres:
    name: PostgreSQL (migrations, seed, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pairly
          POSTGRES_PASSWORD: pairly
          POSTGRES_DB: pairly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pairly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pairly:pairly@localhost:5432/pairly
      MAIL_SUPPRESS_SEND: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Seed the demo store (twice, must be repeatable)
        run: |
          python scripts/seed_demo.py
          python scripts/seed_demo.py
      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Full test suite on PostgreSQL
        env:
          PGPASSWORD: pairly
          PAIRLY_TEST_DATABASE_URL: postgresql://pairly:pairly@localhost:5432/pairly_test
        run: |
          createdb -h localhost -U pairly pairly_test
          pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  cloudflare:
    name: Cloudflare Worker (typecheck + dry run)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Build the web app (static assets)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Typecheck and bundle the Worker
        working-directory: cloudflare
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  docker:
    name: Docker compose (end to end)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          set -o pipefail
          docker compose build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Start
        run: docker compose up --detach --wait --wait-timeout 300
      - name: Check the web app and API through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>Pairly</title>"
          curl -fsS http://localhost:8080/api/health | grep -q healthy
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"Demo@12345"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/analytics/summary | grep -q total_revenue
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/ai/insights | grep -q insights
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true
          # Also publish the tail as an annotation (readable without signing in to GitHub).
          {
            tail -n 25 "$RUNNER_TEMP/build.log" 2>/dev/null || true
            docker compose ps -a --format '{{.Service}}: {{.State}} {{.Status}}' 2>/dev/null || true
            docker compose logs --no-color --tail 25 backend frontend 2>/dev/null || true
          } > "$RUNNER_TEMP/tail.log"
          python3 -c 'import sys; d = open(sys.argv[1]).read(); print("::error title=docker compose logs::" + d.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"))' "$RUNNER_TEMP/tail.log"
      - name: Stop
        if: always()
        run: docker compose down --volumes
